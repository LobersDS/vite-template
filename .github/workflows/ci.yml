name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-template:
    name: Validate template structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: node bin/create.mjs --self-test

  scaffold-and-build:
    name: Scaffold a project and build it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - name: Scaffold test project
        run: printf "test-project\nn\n" | node bin/create.mjs
      - name: Install dependencies
        run: npm install
        working-directory: test-project
      - name: Lint
        run: npm run lint
        working-directory: test-project
      - name: Format check
        run: npm run format:check
        working-directory: test-project
